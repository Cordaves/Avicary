<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Avicary Logo">
  <!-- Right wing-spar forming the structural right leg of the A (Cordaves Navy #1A2440) -->
  <polygon fill="#1A2440" points="33.5,6 56,56 44.5,56 31.2,24.5" />
  <!-- Blade 1: Upper leading feather (Cordaves Deep green #02592A) -->
  <polygon fill="#02592A" points="30.6,7.5 29.5,20.2 25.4,28.2 14.5,31.2" />
  <!-- Blade 2: Mid-upper wing feather (Cordaves Deep blue #0135A8) -->
  <polygon fill="#0135A8" points="24.5,31.2 22.0,39.0 9.5,41.6 13.4,34.0" />
  <!-- Blade 3: Sweeping crossbar wing feather (Cordaves Deep violet #531395) -->
  <polygon fill="#531395" points="35.6,39.5 38.6,45.8 7.5,49.8 11.4,43.8" />
  <!-- Blade 4: Grounding trailing feather accent (Cordaves Crimson #B0122E) -->
  <polygon fill="#B0122E" points="29.8,49.6 24.8,56 8.0,56 9.6,52.4" />
</svg>
